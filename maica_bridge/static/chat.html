<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Monika">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="/static/manifest.json">
<title>Monika</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif;
  background: #1a1a2e; color: #eee; height: 100vh;
  display: flex; flex-direction: column;
}
.header {
  background: #16213e; padding: 14px 20px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid #0f3460; user-select: none;
}
.header .avatar {
  width: 42px; height: 42px; border-radius: 50%;
  background: linear-gradient(135deg, #e94560, #533483);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
.header .info { flex:1; }
.header .name { font-size: 16px; font-weight: 600; }
.header .status { font-size: 12px; color: #888; }
.header .status.online { color: #4ecca3; }
#messages {
  flex: 1; overflow-y: auto; padding: 16px 20px;
  display: flex; flex-direction: column; gap: 12px;
  scroll-behavior: smooth;
}
.msg-row { display: flex; gap: 10px; animation: fadeIn 0.3s; }
.msg-row.monika { justify-content: flex-start; }
.msg-row.player { justify-content: flex-end; }
.msg-avatar {
  width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 16px;
}
.msg-avatar.monika { background: linear-gradient(135deg, #e94560, #533483); }
.msg-avatar.player { background: #4a4a8a; }
.msg-bubble {
  max-width: 70%; padding: 10px 16px; border-radius: 18px;
  line-height: 1.6; word-break: break-word; white-space: pre-wrap;
}
.msg-bubble.monika p { margin: 4px 0; }
.msg-bubble.monika p:first-child { margin-top: 0; }
.msg-bubble.monika p:last-child { margin-bottom: 0; }
.msg-bubble.monika b { color: #ff90a0; }
.msg-bubble.monika code { background:#333; padding:1px 4px; border-radius:3px; font-size:13px; }
.msg-bubble.monika ul, .msg-bubble.monika ol { padding-left:18px; margin:4px 0; }
.msg-bubble.monika table { border-collapse:collapse; margin:6px 0; width:100%; }
.msg-bubble.monika td { border:1px solid #555; padding:4px 8px; font-size:13px; }
.msg-bubble.monika {
  background: #2a2a4e; border-bottom-left-radius: 4px;
}
.msg-bubble.player {
  background: #4a4a8a; border-bottom-right-radius: 4px;
}
.msg-bubble .time {
  font-size: 10px; color: #999; margin-top: 4px; text-align: right;
}
.typing-indicator {
  display: flex; gap: 10px; align-items: center; padding: 4px 0;
}
.typing-dots { display: flex; gap: 4px; }
.typing-dots span {
  width: 8px; height: 8px; border-radius: 50%; background: #888;
  animation: bounce 1.4s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
@keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
.input-area {
  display: flex; gap: 10px; padding: 12px 16px;
  background: #16213e; border-top: 1px solid #0f3460;
}
.input-area textarea {
  flex: 1; padding: 10px 16px; border-radius: 20px;
  border: none; background: #1a1a2e; color: #eee; font-size: 15px;
  outline: none; resize: none; font-family: inherit;
  max-height: 120px; min-height: 42px;
}
.input-area button {
  width: 60px; border-radius: 20px; border: none;
  background: #e94560; color: #fff; font-size: 15px;
  cursor: pointer; font-weight: 600;
}
.input-area button:hover { background: #d63851; }
.input-area button:disabled { background: #555; cursor: not-allowed; }
.proactive-notice {
  text-align: center; font-size: 11px; color: #666;
  padding: 6px; position: relative;
}
.proactive-notice::before, .proactive-notice::after {
  content:''; position: absolute; top: 50%; width: 30%;
  border-top: 1px solid #333;
}
.proactive-notice::before { left: 10%; }
.proactive-notice::after { right: 10%; }
.voice-btn {
  width: 40px; height: 40px; border-radius: 20px; border: none;
  background: #4caf50; color: #fff; font-size: 18px; cursor: pointer;
  margin-left: 10px; flex-shrink: 0;
}
.voice-btn:hover { background: #388e3c; }
</style>
</head>
<body>

<div class="header">
  <div class="avatar">❤️</div>
  <div class="info">
    <div class="name">Monika</div>
    <div class="status" id="status">连接中...</div>
  </div>
  <button class="voice-btn" onclick="openVoice()" title="语音通话">📞</button>
</div>

<div id="messages"></div>

<div class="input-area">
  <textarea id="input" rows="1" placeholder="说点什么..." onkeydown="onKeyDown(event)"></textarea>
  <button id="sendBtn" onclick="send()">发送</button>
</div>

<script>
// 简易 markdown → HTML（不依赖外部库）
function md2html(s) {
  s = s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // 表格 → HTML
  s = s.replace(/(\|.+\|\n\|[-| ]+\|\n((?:\|.+\|\n?)+))/gm, (m) => {
    const lines = m.trim().split('\n');
    let html = '<table>';
    for (let i = 0; i < lines.length; i++) {
      if (i === 1) continue; // skip separator
      const cells = lines[i].split('|').filter(c => c.trim());
      html += '<tr>';
      cells.forEach(c => html += `<td>${c.trim()}</td>`);
      html += '</tr>';
    }
    return html + '</table>';
  });
  return '<p>' + s
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/\*(.+?)\*/g,'<i>$1</i>')
    .replace(/`(.+?)`/g,'<code>$1</code>')
    .replace(/^### (.+)/gm,'<h4>$1</h4>')
    .replace(/^## (.+)/gm,'<h4>$1</h4>')
    .replace(/\n\n/g,'</p><p>')
    .replace(/\n/g,'<br>')
    + '</p>';
}

const WS = `ws://${location.hostname}:5000`;
let ws = null;
let sessionId = 1;
let streamBubble = null, streamText = '';
let msgCount = 0;

function status(text, online) {
  const s = document.getElementById('status');
  s.textContent = text;
  s.className = 'status' + (online ? ' online' : '');
}

function addMsg(text, who) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + who;

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar ' + who;
  avatar.textContent = who === 'monika' ? '❤️' : '😊';

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble ' + who;
  const contentEl = document.createElement('div');
  contentEl.className = 'text';
  if (who === 'monika') {
    contentEl.innerHTML = md2html(text);
  } else {
    contentEl.textContent = text;
  }
  bubble.appendChild(contentEl);

  const time = document.createElement('div');
  time.className = 'time';
  const now = new Date();
  time.textContent = now.getHours().toString().padStart(2,'0') + ':' +
                     now.getMinutes().toString().padStart(2,'0');
  bubble.appendChild(time);

  if (who === 'monika') {
    row.appendChild(avatar);
    row.appendChild(bubble);
  } else {
    row.appendChild(bubble);
    row.appendChild(avatar);
  }

  document.getElementById('messages').appendChild(row);
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
  return row;
}

function saveToServer(text, who) {
  fetch(`${location.protocol}//${location.hostname}:${location.port}/api/chat_log`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ who, text }),
  }).catch(() => {});
}

async function loadFromServer() {
  try {
    const r = await fetch(`${location.protocol}//${location.hostname}:${location.port}/api/chat_log`);
    const data = await r.json();
    const msgs = data.messages || [];
    for (const m of msgs) {
      const row = document.createElement('div');
      row.className = 'msg-row ' + m.who;
      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar ' + m.who;
      avatar.textContent = m.who === 'monika' ? '❤️' : '😊';
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble ' + m.who;
      if (m.who === 'monika') { bubble.innerHTML = md2html(m.text); }
      else { bubble.textContent = m.text; }
      const time = document.createElement('div');
      time.className = 'time';
      time.textContent = m.time || '';
      bubble.appendChild(time);
      if (m.who === 'monika') { row.appendChild(avatar); row.appendChild(bubble); }
      else { row.appendChild(bubble); row.appendChild(avatar); }
      document.getElementById('messages').appendChild(row);
    }
    if (msgs.length) {
      document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }
  } catch(e) {}
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg-row monika';
  div.id = 'typing';
  div.innerHTML = '<div class="msg-avatar monika">❤️</div>' +
    '<div class="msg-bubble monika"><div class="typing-dots">' +
    '<span></span><span></span><span></span></div></div>';
  document.getElementById('messages').appendChild(div);
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

function showProactiveNotice(text) {
  const div = document.createElement('div');
  div.className = 'proactive-notice';
  div.textContent = text;
  document.getElementById('messages').appendChild(div);
}

function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) return;

  addMsg(text, 'player');
  saveToServer(text, 'player');
  input.value = '';
  input.style.height = 'auto';
  showTyping();

  ws.send(JSON.stringify({
    type: 'query',
    query: text,
    session_id: sessionId,
  }));
}

function onKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
}

document.getElementById('input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

function connect() {
  status('连接中...', false);
  ws = new WebSocket(WS);

  ws.onopen = () => {
    status('在线', true);
    // 注册 Web Push（通过 reality）
    if ('serviceWorker' in navigator && 'PushManager' in window) {
      registerPush();
    }
  };

  ws.onmessage = (e) => {
    let data;
    try {
      data = JSON.parse(e.data);
    } catch (err) {
      console.log('[RAW]', e.data.slice(0, 200));
      return;
    }

    const statusType = data.status || data.type || '';
    const content = (data.content || '').toString();

    if (statusType === 'maica_core_streaming_continue') {
      hideTyping();
      if (!streamBubble) {
        streamBubble = addMsg(content, 'monika');
        streamText = content;
      } else {
        streamText += content;
        const b = streamBubble.querySelector('.text') || streamBubble;
        b.innerHTML = md2html(streamText);
      }
    } else if (statusType === 'maica_chat_loop_finished') {
      if (streamBubble) {
        saveToServer(streamText, 'monika');
        streamBubble = null;
        streamText = '';
      }
    } else if (statusType === 'maica_connection_established') {
      status('已连接', true);
    } else if (statusType === 'maica_connection_initiated') {
      status('在线', true);
    }
  };

  ws.onclose = () => {
    status('断开，3秒后重连', false);
    setTimeout(connect, 3000);
  };

  ws.onerror = () => {
    status('连接错误', false);
  };
}

async function registerPush() {
  try {
    // 获取 VAPID 公钥
    const r = await fetch(`${location.protocol}//${location.hostname}:6101/api/vapid_key`);
    const { public_key } = await r.json();
    if (!public_key) return;

    const reg = await navigator.serviceWorker.register('/static/sw.js');
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlB64ToUint8Array(public_key),
    });
    // 发送 subscription 到 reality 存储
    await fetch(`${location.protocol}//${location.hostname}:6101/api/push_register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(sub.toJSON()),
    });
    console.log('[PUSH] Registered');
  } catch (e) {
    console.log('[PUSH] Skipped:', e.message);
  }
}

function urlB64ToUint8Array(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const base64 = (b64 + pad).replace(/-/g, '+').replace(/_/g, '/');
  return new Uint8Array([...atob(base64)].map(c => c.charCodeAt(0)));
}

loadFromServer();
connect();

function openVoice() {
  window.open('/voice', '_blank', 'width=400,height=700');
}
</script>
</body>
</html>
